<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>For Mishtu ❤️</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3,#ffc3a0);
    font-family:'Poppins',sans-serif;
    position:relative;
}

/* Floating Hearts */

.heart{
    position:absolute;
    color:white;
    font-size:20px;
    animation:float 8s linear infinite;
    opacity:0.7;
}

@keyframes float{
    0%{
        transform:translateY(100vh) scale(0);
        opacity:0;
    }
    50%{
        opacity:1;
    }
    100%{
        transform:translateY(-10vh) scale(1.5);
        opacity:0;
    }
}

/* Main Card */

.container{
    position:relative;
    z-index:10;
}

.card{
    width:380px;
    padding:40px;
    border-radius:30px;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(15px);
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
    text-align:center;
    animation:pop 1.2s ease;
}

@keyframes pop{
    from{
        transform:scale(0.5);
        opacity:0;
    }
    to{
        transform:scale(1);
        opacity:1;
    }
}

.teddy{
    font-size:80px;
    animation:bounce 2s infinite;
}

@keyframes bounce{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

h1{
    color:white;
    margin-top:15px;
    font-size:2.3rem;
    text-shadow:2px 2px 10px rgba(0,0,0,0.2);
}

.typing{
    margin-top:20px;
    color:white;
    font-size:1.2rem;
    line-height:1.8;
    min-height:120px;
    white-space:pre-line;
}

.cursor{
    display:inline-block;
    animation:blink 0.7s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

button{
    margin-top:25px;
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:white;
    color:#ff4d88;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
}

/* Glow */

.glow{
    position:absolute;
    width:500px;
    height:500px;
    background:rgba(255,255,255,0.15);
    border-radius:50%;
    filter:blur(80px);
}

.glow1{
    top:-150px;
    left:-150px;
}

.glow2{
    bottom:-150px;
    right:-150px;
}

</style>
</head>

<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<!-- Floating hearts -->
<script>
for(let i=0;i<40;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤️";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(Math.random()*5+5)+"s";
    heart.style.fontSize=(Math.random()*20+10)+"px";
    document.body.appendChild(heart);
}
</script>

<div class="container">
    <div class="card">

        <div class="teddy">🧸</div>

        <h1>Hey Mishtu ❤️</h1>

        <div class="typing" id="typing"></div>

        <button onclick="showLove()">Click Me 🌸</button>

    </div>
</div>

<script>

const message = 
`I love you Mishtu ❤️

I am so proud of you.

Keep working hard and keep shining like you always do ✨

No matter what happens,
always remember that
you are special to me 🌸`;

let i = 0;

function typeWriter(){
    if(i < message.length){
        document.getElementById("typing").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 50);
    }
}

typeWriter();

function showLove(){
    alert("You mean a lot to me ❤️");
}

</script>

</body>
</html>
